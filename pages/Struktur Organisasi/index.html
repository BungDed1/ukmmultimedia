<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur Organisasi - UKM Multimedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style/main.css">
</head>

<body class="bg-light" style="font-family: 'Poppins', sans-serif;">
    <div id="tempat-navbar"></div>

    <section class="py-5" style="background-color: #800000; color: white;">
        <div class="container text-center py-5">
            <h1 class="fw-bold display-5">Struktur Pengurus</h1>
            <p class="lead" style="font-family: 'Cardo', serif; font-style: italic;">Motor penggerak roda organisasi
                kami.</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h3 class="fw-bold" style="color: #800000;">Badan Pengurus Harian (BPH)</h3>
            </div>

            <div class="row justify-content-center g-4">
                <div class="col-lg-3 col-md-4 col-sm-6">
                    <div class="card border-0 shadow-sm text-center p-4 h-100 rounded-4">
                        <div class="bg-secondary rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;">
                        </div>
                        <h6 class="fw-bold mb-1">Dedy Indra S.</h6>
                        <p class="text-muted small mb-0">Ketua Umum</p>
                    </div>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6">
                    <div class="card border-0 shadow-sm text-center p-4 h-100 rounded-4">
                        <div class="bg-secondary rounded-circle mx-auto mb-3" style="width: 100px; height: 100px;">
                        </div>
                        <h6 class="fw-bold mb-1">Nama Wakil</h6>
                        <p class="text-muted small mb-0">Wakil Ketua</p>
                    </div>
                </div>
            </div>

            <div class="text-center mt-5 mb-4">
                <h4 class="fw-bold" style="color: #800000;">Departemen</h4>
            </div>
            <div class="row g-4 text-center justify-content-center">
                <div class="col-md-3">
                    <div class="p-3 bg-white shadow-sm rounded-3 fw-bold">Divisi Fotografi</div>
                </div>
                <div class="col-md-3">
                    <div class="p-3 bg-white shadow-sm rounded-3 fw-bold">Divisi Videografi</div>
                </div>
                <div class="col-md-3">
                    <div class="p-3 bg-white shadow-sm rounded-3 fw-bold">Divisi Kewirausahaan</div>
                </div>
            </div>
        </div>
    </section>

    <div id="tempat-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/function/navbar.js"></script>
    <script src="/function/footer.js"></script>
</body>

</html>
