<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Admin - UKM Multimedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style/main.css">
</head>

<body class="bg-light" style="font-family: 'Poppins', sans-serif;">
    <div id="tempat-navbar"></div>

    <section class="py-5" style="background-color: #800000; color: white;">
        <div class="container text-center py-5">
            <h1 class="fw-bold display-5">Hubungi Kami</h1>
            <p class="lead" style="font-family: 'Cardo', serif; font-style: italic;">Kami siap mendengarkan aspirasi dan
                pertanyaan Anda.</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 bg-white p-5 shadow-sm rounded-4">
                    <h4 class="fw-bold mb-4">Kirim Pesan</h4>
                    <form>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Nama Lengkap</label>
                            <input type="text" class="form-control" placeholder="Masukkan nama Anda">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Kategori Pertanyaan</label>
                            <select class="form-select">
                                <option>Pendaftaran Anggota Baru</option>
                                <option>Informasi Kegiatan</option>
                                <option>Lainnya</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small">Pesan</label>
                            <textarea class="form-control" rows="4"
                                placeholder="Tulis pesan Anda di sini..."></textarea>
                        </div>
                        <button type="button" class="btn w-100 text-white fw-bold py-2"
                            style="background-color: #800000;">Kirim via WhatsApp</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <div id="tempat-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/function/navbar.js"></script>
    <script src="/function/footer.js"></script>
</body>

</html>
