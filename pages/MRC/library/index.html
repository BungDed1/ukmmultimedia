<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"

    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/mrc-style.css">

<body class="bg-light mrc-page-wrapper">
    <div id="tempat-navbar"></div>

    <section class="global-hero-rounded">
        <div class="container text-center">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb justify-content-center mb-0">
                    <li class="breadcrumb-item"><a href="/index.html"

                    <li class="breadcrumb-item"><a href="/pages/MRC/index.html"

                    <li class="breadcrumb-item active text-white small fw-bold" aria-current="page">Digital Library</li>
                </ol>
            </nav>
            <h1 class="fw-bold display-4 mb-3">Digital Library</h1>
            <p class="lead mx-auto"
                style="font-family: 'Cardo', serif; font-style: italic; max-width: 600px; opacity: 0.9;">
                Akses modul pelatihan, arsip naskah, dan literasi digital dalam satu genggaman.
            </p>
        </div>

    <main class="mrc-content-flex py-5 mt-4">
        <div class="container">
            <div class="row g-4 d-flex align-items-stretch" id="libraryContainer">

                <div class="col-lg-4 col-md-6">
                    <div class="lab-card accent-maroon shadow-sm h-100 d-flex flex-column">
                        <div class="d-flex align-items-center mb-4">
                            <div class="p-3 bg-light rounded-3 me-3"><i class="bi bi-journal-code fs-4 text-maroon"></i>
                            </div>
                            <h5 class="fw-bold mb-0">Modul Pelatihan</h5>
                        </div>
                        <div class="lab-list-item small text-muted fw-bold" id="count-modul">Memuat data...</div>
                        <div class="mt-auto pt-4 text-center border-top">
                            <a href="/pages/MRC/library/modul.html" class="btn-mrc-pro w-100">
                                <i class="bi bi-folder2-open me-2"></i> Buka Folder
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 col-md-6">
                    <div class="lab-card accent-maroon shadow-sm h-100 d-flex flex-column">
                        <div class="d-flex align-items-center mb-4">
                            <div class="p-3 bg-light rounded-3 me-3"><i
                                    class="bi bi-file-earmark-richtext fs-4 text-maroon"></i></div>
                            <h5 class="fw-bold mb-0">Naskah & Skenario</h5>
                        </div>
                        <div class="lab-list-item small text-muted fw-bold" id="count-naskah">Memuat data...</div>
                        <div class="mt-auto pt-4 text-center border-top">

                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 col-md-6">
                    <div class="lab-card accent-maroon shadow-sm h-100 d-flex flex-column">
                        <div class="d-flex align-items-center mb-4">
                            <div class="p-3 bg-light rounded-3 me-3"><i class="bi bi-book fs-4 text-maroon"></i></div>
                            <h5 class="fw-bold mb-0">E-Book & Literasi</h5>
                        </div>
                        <div class="lab-list-item small text-muted fw-bold" id="count-ebook">Memuat data...</div>
                        <div class="mt-auto pt-4 text-center border-top">
                            <a href="/pages/MRC/library/ebook.html" class="btn-mrc-pro w-100">
                                <i class="bi bi-collection me-2"></i> Baca Koleksi
                            </a>

                    </div>
                </div>

            </div>
