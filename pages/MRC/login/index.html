<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login MRC - UKM MM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/mrc-login.css">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card text-center">

            <div class="brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h4 class="fw-bold text-dark mb-1">MRC Login</h4>
            <p class="text-muted small mb-4">Masuk dengan email dan password anggota Anda</p>

            <form id="loginForm" class="text-start">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted ms-1">EMAIL</label>
                    <div class="custom-input-group d-flex align-items-center">
                        <input type="email" id="loginEmail" class="form-control py-3 px-3"
                            placeholder="nama@email.com" autocomplete="username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted ms-1">PASSWORD</label>
                    <div class="custom-input-group d-flex align-items-center">
                        <input type="password" id="loginPassword" class="form-control py-3 px-3"
                            placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="icon-btn" onclick="togglePassword()">
                            <i class="bi bi-eye-slash" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div id="errorMessage" class="text-danger small mt-2 mb-3 ms-1 d-none">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    <span id="errorMessageText">Email atau password salah!</span>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-khas-tum w-100 mb-4">
                    <span id="loginSubmitText">MASUK</span>
                </button>
            </form>

            <a href="/index.html" class="text-muted small text-decoration-none hover-maroon-text fw-medium">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda
            </a>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/function/mrc/supabase-config.js"></script>
    <script src="/function/mrc/supabase-auth.js"></script>
    <script src="/function/mrc/login-ui.js"></script>

</body>

</html>
