<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Gateway - MRC UKM MM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style/main.css">
    <style>
        .login-box {
            border-radius: 30px;
            border: 1px solid rgba(128, 0, 0, 0.1);
            overflow: hidden;
        }

        .bg-maroon-gradient {
            background: linear-gradient(135deg, #800000 0%, #4a0000 100%);
        }

        .form-control:focus {
            border-color: #800000;
            box-shadow: 0 0 0 0.25rem rgba(128, 0, 0, 0.1);
        }
    </style>
</head>

<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-box bg-white shadow-lg">
                    <div class="p-5 text-center bg-maroon-gradient text-white">
                        <i class="bi bi-shield-lock-fill display-4 mb-3"></i>
                        <h3 class="fw-bold">MRC Gateway</h3>
                        <p class="small opacity-75 mb-0">Multimedia Resource Center Access</p>
                    </div>
                    <div class="p-5">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">MASUKKAN AKSES KEY / ID PESERTA</label>
                            <input type="password" id="accessKey" class="form-control form-control-lg rounded-pill px-4"
                                placeholder="••••••••">
                            <div id="errorMessage" class="text-danger small mt-2 d-none">Akses ditolak. Silakan cek
                                kembali kuncinya!</div>
                        </div>
                        <button onclick="checkAccess()"
                            class="btn btn-dark w-100 rounded-pill py-3 fw-bold mb-3">Verifikasi Akses</button>
                        <div class="text-center">
                            <a href="/index.html" class="text-muted small text-decoration-none"><i
                                    class="bi bi-arrow-left"></i> Kembali ke Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/function/mrc/auth.js"></script>
</body>

</html>
