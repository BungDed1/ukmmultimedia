<!DOCTYPE html>
<html lang="id">

<head>
    <script>document.documentElement.style.visibility = 'hidden';</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/function/mrc/supabase-config.js"></script>
    <script src="/function/mrc/site-settings.js"></script>
    <script src="/function/mrc/supabase-auth.js"></script>
    <script src="/function/mrc/mrc-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Acak - Kelas Film UKM MM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/mrc-style.css">
    <style>
        .card-topi-maroon {
            border-top: 10px solid #800000 !important;
            border-radius: 1.5rem !important;
            overflow: hidden;
        }

        .list-mengerjakan {
            max-height: 400px;
            overflow-y: auto;
        }

        .badge-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .soal-card {
            border-left: 5px solid #800000;
            background: #f8f9fa;
        }
    </style>
</head>

<body class="bg-light mrc-page-wrapper d-flex flex-column min-vh-100">
    <div id="tempat-navbar"></div>

    <section class="global-hero-rounded">
        <div class="container text-center">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb justify-content-center mb-0">
                    <li class="breadcrumb-item"><a href="/index.html"
                            class="text-white-50 text-decoration-none small">Beranda</a></li>
                    <li class="breadcrumb-item"><a href="/pages/MRC/index.html"
                            class="text-white-50 text-decoration-none small">MRC</a></li>
                    <li class="breadcrumb-item active text-white small fw-bold" aria-current="page">Quiz Acak</li>
                </ol>
            </nav>
            <h1 class="fw-bold display-4 mb-3">Quiz Acak Kelas Film</h1>
            <p class="lead mx-auto"
                style="font-family: 'Cardo', serif; font-style: italic; max-width: 600px; opacity: 0.9;">
                "Uji pemahaman materi Pertemuan 2 dengan sistem acak."
            </p>
        </div>
    </section>

    <main class="py-5 flex-grow-1">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-4 order-2 order-lg-1">
                    <div class="lab-card shadow-sm p-4 card-topi-maroon bg-white">
                        <h5 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-people-fill me-2 text-maroon"></i>
                            Monitoring</h5>

                        <div class="mb-4">
                            <label class="small fw-bold text-success text-uppercase mb-2 d-block">Sudah
                                Mengerjakan</label>
                            <div id="list-sudah" class="list-mengerjakan border rounded p-2 bg-light">
                                <div class="text-muted small p-2">Memuat data...</div>
                            </div>
                        </div>

                        <div>
                            <label class="small fw-bold text-danger text-uppercase mb-2 d-block">Belum
                                Mengerjakan</label>
                            <div id="list-belum" class="list-mengerjakan border rounded p-2 bg-light">
                                <div class="text-muted small p-2">Memuat data...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8 order-1 order-lg-2">
                    <div class="lab-card shadow-sm p-4 card-topi-maroon bg-white h-100">

                        <div id="view-pilih-set">
                            <h4 class="fw-bold mb-4">Pilih Paket Soal</h4>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <button class="btn btn-outline-dark w-100 py-4 rounded-4 shadow-sm"
                                        onclick="mulaiQuiz(1)">
                                        <i class="bi bi-collection-play-fill d-block fs-2 mb-2 text-maroon"></i>
                                        <strong>Set Soal A</strong><br><small class="text-muted">5 Soal Acak</small>
                                    </button>
                                </div>
                                <div class="col-md-4">
                                    <button class="btn btn-outline-dark w-100 py-4 rounded-4 shadow-sm"
                                        onclick="mulaiQuiz(2)">
                                        <i class="bi bi-collection-play-fill d-block fs-2 mb-2 text-maroon"></i>
                                        <strong>Set Soal B</strong><br><small class="text-muted">5 Soal Acak</small>
                                    </button>
                                </div>
                                <div class="col-md-4">
                                    <button class="btn btn-outline-dark w-100 py-4 rounded-4 shadow-sm"
                                        onclick="mulaiQuiz(3)">
                                        <i class="bi bi-collection-play-fill d-block fs-2 mb-2 text-maroon"></i>
                                        <strong>Set Soal C</strong><br><small class="text-muted">5 Soal Acak</small>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div id="view-form-quiz" class="d-none">
                            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                                <h5 class="fw-bold mb-0 text-maroon" id="judul-set">Set Soal</h5>
                                <button class="btn btn-sm btn-light border rounded-pill"
                                    onclick="location.reload()">Ganti Set</button>
                            </div>

                            <form id="quiz-form">
                                <div class="mb-4 p-3 bg-light rounded-3 border">
                                    <label class="form-label fw-bold small text-uppercase">Identitas Peserta</label>
                                    <select class="form-select rounded-pill border-maroon shadow-sm" id="nama-peserta"
                                        required>
                                        <option value="">-- Pilih Nama Kamu --</option>
                                    </select>
                                </div>

                                <div id="container-soal"></div>

                                <button type="submit"
                                    class="btn btn-mrc-pro w-100 rounded-pill py-3 mt-4 fw-bold shadow">
                                    <i class="bi bi-send-check-fill me-2"></i> Kirim Jawaban Quiz
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="tempat-footer" class="mt-auto"></div>
    <script src="/function/navbar.js"></script>
    <script src="/function/footer.js"></script>
    <script src="/function/mrc/kelas-film/quiz-logic.js"></script>
</body>

</html>
