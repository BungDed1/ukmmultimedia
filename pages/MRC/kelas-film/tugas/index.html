<!DOCTYPE html>
<html lang="id">

<head>
    <script>document.documentElement.style.visibility = 'hidden';</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/function/mrc/supabase-config.js"></script>
    <script src="/function/mrc/site-settings.js"></script>
    <script src="/function/mrc/supabase-auth.js"></script>
    <script src="/function/mrc/mrc-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumpulan Tugas - Kelas Film UKM MM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/mrc-style.css">
</head>

<body class="bg-light mrc-page-wrapper">
    <div id="tempat-navbar"></div>

    <section class="global-hero-rounded">
        <div class="container text-center">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb justify-content-center mb-0">
                    <li class="breadcrumb-item"><a href="/index.html"
                            class="text-white-50 text-decoration-none small">Beranda</a></li>
                    <li class="breadcrumb-item"><a href="/pages/MRC/index.html"
                            class="text-white-50 text-decoration-none small">MRC</a></li>
                    <li class="breadcrumb-item active text-white small fw-bold" aria-current="page">Pengumpulan Tugas
                    </li>
                </ol>
            </nav>
            <h1 class="fw-bold display-4 mb-3">Portal Submit Tugas</h1>
        </div>
    </section>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center g-4">

                <div class="col-lg-5">
                    <div class="lab-card accent-maroon shadow-sm p-4 h-100">
                        <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                            <i class="bi bi-cloud-arrow-up-fill fs-4 text-maroon me-3"></i>
                            <h5 class="fw-bold mb-0 text-dark">Formulir Setor Tugas</h5>
                        </div>

                        <form id="form-tugas">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Nama Kelompok (PH)</label>
                                <input type="text" id="nama_ph" class="form-control bg-light"
                                    placeholder="Contoh: PH Bungnema" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Jenis Tugas</label>
                                <select id="jenis_tugas" class="form-select bg-light" required>
                                    <option value="" selected disabled>-- Pilih Kategori Tugas --</option>
                                    <option value="Draft Skenario">Draft Skenario / Naskah</option>
                                    <option value="Breakdown Sheet">Breakdown Sheet</option>
                                    <option value="RAB Produksi">RAB Produksi</option>
                                    <option value="Tugas Editing Video">Tugas Editing Video</option>
                                    <option value="Final Project Film">Final Project Film</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Upload File Tugas</label>
                                <input type="file" id="file_tugas" class="form-control bg-light border-maroon-subtle"
                                    accept=".pdf,.doc,.docx,.xls,.xlsx,.zip,.mp4" required>
                                <div class="form-text x-small text-danger">Maksimal 50MB. Disarankan PDF, DOCX, XLSX,
                                    atau ZIP.</div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">Catatan Tambahan (Opsional)</label>
                                <textarea id="catatan" class="form-control bg-light" rows="2"
                                    placeholder="Catatan untuk mentor..."></textarea>
                            </div>

                            <button type="submit" id="btn-submit" class="btn-mrc-pro w-100 py-2 fs-6">
                                <i class="bi bi-send-fill me-2"></i> Upload & Kumpul Tugas
                            </button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="lab-card shadow-sm p-4 h-100">
                        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                            <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-clock-history me-2"></i> Riwayat
                                Pengumpulan</h5>
                            <button onclick="fetchRiwayatTugas()"
                                class="btn btn-sm btn-light border rounded-pill text-muted">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                        </div>

                        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                            <table class="table table-hover align-middle text-nowrap">
                                <thead class="table-light" style="position: sticky; top: 0; z-index: 1;">
                                    <tr class="small text-uppercase fw-bold text-muted">
                                        <th>Kelompok / PH</th>
                                        <th>Tugas</th>
                                        <th class="text-end">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tabel-riwayat-body" class="small">
                                    <tr>
                                        <td colspan="3" class="text-center py-5 text-muted">
                                            <div class="spinner-border spinner-border-sm text-maroon me-2"></div> Memuat
                                            riwayat...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>

            <div class="mt-5 text-center">
                <a href="/pages/MRC/index.html" class="btn btn-outline-dark rounded-pill px-4 fw-bold">
                    <i class="bi bi-arrow-left me-2"></i> Kembali ke Dashboard Kelas Film
                </a>
            </div>
        </div>
    </main>

    <div id="tempat-footer"></div>

    <script src="/function/navbar.js"></script>
    <script src="/function/footer.js"></script>
    <script src="/function/mrc/kelas-film/tugas.js"></script>
</body>

</html>
