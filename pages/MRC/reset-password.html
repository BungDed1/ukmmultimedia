<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - UKM MM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/mrc-login.css">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card text-center">

            <div class="brand-icon">
                <i class="bi bi-key-fill"></i>
            </div>

            <h4 class="fw-bold text-dark mb-1">Atur Password Baru</h4>
            <p class="text-muted small mb-4">Masukkan password baru untuk akun MRC-mu</p>

            <form id="resetForm" class="text-start">
                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted ms-1">PASSWORD BARU</label>
                    <div class="custom-input-group d-flex align-items-center">
                        <input type="password" id="newPassword" class="form-control py-3 px-3"
                            placeholder="Minimal 6 karakter" minlength="6" autocomplete="new-password" required>
                    </div>
                </div>

                <div id="resetErrorMessage" class="text-danger small mt-2 mb-3 ms-1 d-none"></div>
                <div id="resetSuccessMessage" class="text-success small mt-2 mb-3 ms-1 d-none"></div>

                <button type="submit" id="resetSubmitBtn" class="btn btn-khas-tum w-100 mb-4">
                    <span id="resetSubmitText">SIMPAN PASSWORD BARU</span>
                </button>
            </form>

            <a href="/pages/MRC/login/index.html" class="text-muted small text-decoration-none hover-maroon-text fw-medium">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Login
            </a>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/function/mrc/supabase-config.js"></script>
    <script src="/function/mrc/supabase-auth.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const errorBox = document.getElementById('resetErrorMessage');
            const successBox = document.getElementById('resetSuccessMessage');
            const btn = document.getElementById('resetSubmitBtn');
            const btnText = document.getElementById('resetSubmitText');

            errorBox.classList.add('d-none');
            successBox.classList.add('d-none');
            btn.disabled = true;
            btnText.textContent = 'MEMPROSES...';

            const result = await window.supabaseAuth.updatePassword(newPassword);

            if (result.success) {
                successBox.textContent = 'Password berhasil diubah! Mengalihkan ke login...';
                successBox.classList.remove('d-none');
                setTimeout(() => { window.location.href = '/pages/MRC/login/index.html'; }, 1800);
            } else {
                errorBox.textContent = result.error || 'Link reset sudah kedaluwarsa. Minta link baru dari admin.';
                errorBox.classList.remove('d-none');
                btn.disabled = false;
                btnText.textContent = 'SIMPAN PASSWORD BARU';
            }
        });
    </script>

</body>

</html>
