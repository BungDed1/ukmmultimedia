<!DOCTYPE html>
<html lang="id">

<head>
    <script src="/function/mrc/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat - UKM Multimedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/mrc-style.css">
</head>

<body class="bg-light mrc-page-wrapper">
    <div id="tempat-navbar"></div>
    <section class="global-hero-rounded">
        <div class="container text-center">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb justify-content-center mb-0">
                    <li class="breadcrumb-item"><a href="/index.html"
                            class="text-white-50 text-decoration-none small">Beranda</a></li>
                    <li class="breadcrumb-item" id="mrcBreadcrumb"><a href="/pages/MRC/index.html"
                            class="text-white-50 text-decoration-none small">MRC</a></li>
                    <li class="breadcrumb-item"><a href="/pages/MRC/certificates/index.html"
                            class="text-white-50 text-decoration-none small">Certificate Center</a></li>
                    <li class="breadcrumb-item active text-white small fw-bold" aria-current="page">Detail</li>
                </ol>
            </nav>
            <h1 class="fw-bold display-4 mb-3">Penerimaan Anggota Baru</h1>
        </div>
    </section>
    <main class="py-5 mt-4">
        <div class="container">
            <div class="lab-card accent-maroon shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-3">
                    <h5 class="fw-bold mb-0">Daftar Penerima</h5>
                    <input type="text" id="participantSearch" class="form-control w-auto bg-light"
                        placeholder="Cari Nama/ID...">
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="participantTable">
                        <thead class="table-light">
                            <tr class="small text-uppercase fw-bold text-muted">
                                <th>Nama Lengkap</th>
                                <th class="text-center">Peran</th>
                                <th class="text-center">ID</th>
                                <th class="text-end">Aksi</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="mt-4 pt-3 border-top text-end">
                    <a href="/pages/MRC/certificates/index.html" class="btn btn-mrc-pro">Kembali</a>
                </div>
            </div>
        </div>
    </main>
    <div id="tempat-footer"></div>
    <script src="/function/navbar.js"></script>
    <script src="/function/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/function/mrc/supabase-config.js"></script>
    <script src="/function/mrc/participant.js"></script>
